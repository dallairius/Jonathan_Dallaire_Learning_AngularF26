<div>
<h3>{{ orderInput().name | titlecase }}</h3>

  @if(expanded){

  <p>{{ orderInput().address | lowercase }}</p>
    <!--None of the other pipes fit so slice is used. Shows the first
     256 character of the email address-->
  <p>{{ orderInput().email | slice:0:256}}</p>
  <p>{{ orderInput().phone }}</p>





    <br>

    <button (click)="toggle()">Show Less</button>

  }@else{<button (click)="toggle()">Expand</button>}
  <button (click)="delete()">Remove</button>
  <a [routerLink]="['/orders',orderInput().id]">Details</a>
  <a [routerLink]="['/orderForm',orderInput().id]">Edit</a>

</div>
