<mat-card appearance="outlined" appHover>

  <mat-card-header>
    <mat-card-title>{{ orderInput().name | titlecase }}</mat-card-title>
  </mat-card-header>

  @if(expanded){

  <p>{{ orderInput().address | lowercase }}</p>
    <!--None of the other pipes fit so slice is used. Shows the first
     256 character of the email address-->
  <p>{{ orderInput().email | slice:0:256}}</p>
  <p>{{ orderInput().phone | slice:1:11 | phonePipe:'No phone listed'}}</p>





    <br>
    <mat-card-actions>
      <button matButton (click)="toggle()">Show Less</button>
    </mat-card-actions>
  }@else{
    <mat-card-actions>
      <button matButton (click)="toggle()">Expand</button>

      @if(!savedList()){
        <button matButton
          appProtect="Delete this item?"
          (confirmed)="delete()"
        >Remove</button>
      }
    </mat-card-actions>
  }



  <mat-card-actions>
    <button matButton [routerLink]="['/orders',orderInput().id]">Details</button>
    <button matButton [routerLink]="['/orderForm',orderInput().id]">Edit</button>
  </mat-card-actions>
</mat-card>
