<div>
<h3>{{ orderInput().customerName }}</h3>

  @if(expanded){

  <p>{{ orderInput().howMany }} tacos</p>

  @if(orderInput().combo){
    <p>Is a combo</p>
  }@else{
    <p>Is not a combo</p>
  }


  @switch(orderInput().whichProtein){
    @case ("beef"){Beef}
    @case ("chicken"){Chicken}
    @case ("pork"){Pork}
    @default{}
  }
    <br>


  }
  <button (click)="toggle()">Expand</button>
  <button (click)="delete()">Remove</button>
</div>
