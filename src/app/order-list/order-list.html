@for(order of orderArray(); track order.orderId){

  <app-order-list-item
   [orderInput] = "order"
   (isRemoved)="onOrderRemoved($event)"/>
}@empty{
  no orders to show
}
<a [routerLink]="['/orderForm']">Add New Order</a>
<p>Combo orders: {{comboCount}}</p>
<p>Api Test Url: {{apiTest}}</p>
@for(order of comboOrders(); track order.orderId){
  <app-order-list-item [orderInput] = "order"/>
}@empty{
  no combo orders to show
}
