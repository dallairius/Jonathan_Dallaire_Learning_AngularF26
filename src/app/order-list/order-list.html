@for(order of orderArray(); track order.orderId){
 <app-order-list-item
   [orderInput] = "order"
   (isOpened)="onOrderOpened($event)"/>
}@empty{
  no orders to show
}
<p>Combo orders</p>
@for(order of comboOrders(); track order.orderId){
  <app-order-list-item [orderInput] = "order"/>
}@empty{
  no combo orders to show
}
