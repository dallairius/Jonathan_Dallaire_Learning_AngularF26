@if(order(); as o){
  <h2>{{o.name}}</h2>
  <p>{{o.address}}</p>
  <p>{{o.phone}}</p>
  <!-- This lets the pipe add html instead of just transforming the string -->
  <p [innerHTML]="o.email | bold"></p>
  @if(!savedList().includes(id())){
    <button matButton (click)="toggleSaved()">Save</button>
  }@else{
    <button matButton (click)="toggleSaved()">Unsave</button>
  }

}
